     - FOTOGRAFÍAS
     - VIDEOS
     - TEXTOS
     - LINKS

     SE REALIZAN AQUÍ, EN HTML.

     IMPORTANTE:
     Los template no aparecen directamente
     en pantalla. JavaScript toma el contenido
     y lo muestra en la diapositiva seleccionada.

     Para agregar una foto:
     src="imagenes/foto1.jpg"

     Para agregar un video:
     src="videos/video1.mp4"

     Deja src="" si no tienes el archivo.
     ========================================== -->

<!-- ==========================================
     ESTRUCTURA VISUAL DE LAS DIAPOSITIVAS
     ========================================== -->

<div id="escenario">

  <!-- =====================================
       DIAPOSITIVA 1: INICIO
       ===================================== -->

  <section class="diapositiva activa" id="inicio">

    <!-- TÍTULO PRINCIPAL EDITABLE -->
    <h1 class="titulo-principal">
      Portafolio Digital
    </h1>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="barra">

      <span class="celda"></span>

      <!-- ENLACE EDITABLE -->
      <a class="celda" href="#wiki">
        Wiki Casiopea
      </a>

      <!-- ABRE LA DIAPOSITIVA 2 -->
      <a class="celda"
         href="#imagen-escrita"
         id="abrir-imagen">
        Imagen escrita
      </a>

      <!-- ENLACE EDITABLE -->
      <a class="celda" href="#sobre-mi">
        Sobre Mi
      </a>

      <span class="celda"></span>

    </nav>

    <!-- TÍTULO EDITABLE -->
    <h2 class="titulo-seccion">
      Imagen Escrita
    </h2>

    <!-- DESCRIPCIÓN EDITABLE -->
    <p class="descripcion-inicio">
      El curso mezlca
    </p>

  </section>


  <!-- =====================================
       DIAPOSITIVA 2: RUEDA INTERACTIVA
       ===================================== -->

  <section class="diapositiva" id="imagen-escrita">

    <!-- REGRESAR AL INICIO -->
    <button class="volver"
            type="button"
            aria-label="Volver al inicio">

      <svg viewBox="0 0 80 80">
        <path d="M39 0 L0 39 L39 78
                 L39 57 L77 57 L77 20
                 L39 20 Z"/>
      </svg>

    </button>

    <!-- RUEDA DE SEIS SECTORES -->
    <div class="rueda">

      <svg class="rueda-svg" viewBox="0 0 520 520">

        <defs id="clips-rueda"></defs>

        <g id="sectores-rueda"></g>

        <circle cx="260"
                cy="260"
                r="247"
                fill="none"
                stroke="black"
                stroke-width="19"
                pointer-events="none"/>

      </svg>

      <!-- PERILLA GIRATORIA -->
      <div class="perilla">

        <div class="perilla-interior"></div>

        <div class="aguja" id="aguja"></div>

      </div>

    </div>

    <!-- RECTÁNGULO DERECHO -->
    <div class="marco-derecho">

      <!--
        FOTO O VIDEO DEL SECTOR SELECCIONADO.

        Se muestra automáticamente a partir
        del HTML de los encargos.
      -->
      <div id="imagen-grande" class="panel-verde"></div>

    </div>

  </section>


  <!-- =====================================
       DIAPOSITIVA 3: DETALLE DEL ENCARGO
       ===================================== -->

  <section class="diapositiva" id="detalle">

    <!-- REGRESAR AL INICIO -->
    <button class="volver"
            type="button"
            aria-label="Volver al inicio">

      <svg viewBox="0 0 80 80">
        <path d="M39 0 L0 39 L39 78
                 L39 57 L77 57 L77 20
                 L39 20 Z"/>
      </svg>

    </button>

    <!-- MISMA FOTO O VIDEO SELECCIONADO -->
    <div class="marco-izquierdo">

      <div id="imagen-detalle" class="panel-verde"></div>

    </div>

    <!-- RECTÁNGULO CON TEXTOS -->
    <div class="marco-texto">

      <div class="circulo-gris">

        <!-- TÍTULO INSERTADO DESDE HTML -->
        <h2 id="titulo-encargo">
          Encargo 1
        </h2>

        <!-- TEXTO IZQUIERDO -->
        <p class="texto-izquierda"
           id="texto-izquierda"></p>

        <!-- TEXTO DERECHO -->
        <p class="texto-derecha"
           id="texto-derecha"></p>

        <!-- CÍRCULO CENTRAL -->
        <div class="anillo-gris">
          <div class="orificio"></div>
        </div>

        <!-- ENLACES INSERTADOS DESDE HTML -->
        <div class="enlaces">

          <a id="link-jp5"
             href="#"
             target="_blank"
             rel="noopener noreferrer">
            LINK JP5
          </a>

          <a id="link-wiki"
             href="#"
             target="_blank"
             rel="noopener noreferrer">
            LINK WIKI
          </a>

        </div>

      </div>

    </div>

  </section>

</div>
