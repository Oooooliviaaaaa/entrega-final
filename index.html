

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Portafolio Digital</title>

  <!-- ARCHIVO DE ESTILOS -->
  <link rel="stylesheet" href="estilos.css">
</head>

<body>

<div id="escenario">

  <!-- =====================================
       DIAPOSITIVA 1: PÁGINA PRINCIPAL

       AQUÍ PUEDES CAMBIAR:
       - Título del portafolio
       - Textos de navegación
       - Descripción del curso
       ===================================== -->

  <section class="diapositiva activa" id="inicio">

    <!-- TÍTULO PRINCIPAL -->
    <h1 class="titulo-principal">
      Portafolio Digital
    </h1>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="barra">

      <span class="celda"></span>

      <!-- BOTÓN WIKI CASIOPEA -->
      <a class="celda" href="#wiki">
        Wiki Casiopea
      </a>

      <!-- BOTÓN QUE ABRE LA DIAPOSITIVA 2 -->
      <a class="celda"
         href="#imagen-escrita"
         id="abrir-imagen">
        Imagen escrita
      </a>

      <!-- BOTÓN SOBRE MÍ -->
      <a class="celda" href="#sobre-mi">
        Sobre Mi
      </a>

      <span class="celda"></span>

    </nav>

    <!-- TÍTULO EDITABLE -->
    <h2 class="titulo-seccion">
      Imagen Escrita
    </h2>

    <!-- DESCRIPCIÓN EDITABLE -->
    <p class="descripcion-inicio">
      El curso mezlca
    </p>

  </section>


  <!-- =====================================
       DIAPOSITIVA 2: RUEDA INTERACTIVA
       ===================================== -->

  <section class="diapositiva" id="imagen-escrita">

    <!-- FLECHA PARA VOLVER AL INICIO -->
    <button class="volver"
            type="button"
            aria-label="Volver al inicio">

      <svg viewBox="0 0 80 80">
        <path d="M39 0 L0 39 L39 78
                 L39 57 L77 57 L77 20
                 L39 20 Z"/>
      </svg>

    </button>

    <!-- RUEDA DE SEIS SECTORES -->
    <div class="rueda">

      <svg class="rueda-svg" viewBox="0 0 520 520">

        <!-- RECORTES PARA FOTOGRAFÍAS -->
        <defs id="clips-rueda"></defs>

        <!-- SECTORES GENERADOS POR JAVASCRIPT -->
        <g id="sectores-rueda"></g>

        <!-- CIRCUNFERENCIA EXTERIOR -->
        <circle
          cx="260"
          cy="260"
          r="247"
          fill="none"
          stroke="black"
          stroke-width="19"
          pointer-events="none"/>

      </svg>

      <!-- PERILLA GIRATORIA -->
      <div class="perilla">

        <div class="perilla-interior"></div>

        <div class="aguja" id="aguja"></div>

      </div>

    </div>

    <!-- =====================================
         RECTÁNGULO DERECHO

         El marco negro y la imagen verde
         se abrirán juntos como un libro.

         La imagen depende del sector elegido.
         ===================================== -->

    <div class="marco-derecho">

      <div id="imagen-grande"
           class="panel-verde">
      </div>

    </div>

  </section>


  <!-- =====================================
       DIAPOSITIVA 3: DETALLE DEL ENCARGO

       Mantiene la fotografía seleccionada
       y muestra sus textos correspondientes.
       ===================================== -->

  <section class="diapositiva" id="detalle">

    <!-- FLECHA PARA VOLVER AL INICIO -->
    <button class="volver"
            type="button"
            aria-label="Volver al inicio">

      <svg viewBox="0 0 80 80">
        <path d="M39 0 L0 39 L39 78
                 L39 57 L77 57 L77 20
                 L39 20 Z"/>
      </svg>

    </button>

    <!-- MISMA FOTOGRAFÍA SELECCIONADA -->
    <div class="marco-izquierdo">

      <div id="imagen-detalle"
           class="panel-verde">
      </div>

    </div>

    <!-- RECTÁNGULO DERECHO CON TEXTOS -->
    <div class="marco-texto">

      <div class="circulo-gris">

        <!-- TÍTULO EDITABLE DEL ENCARGO -->
        <h2 id="titulo-encargo">
          Encargo 1
        </h2>

        <!-- TEXTO IZQUIERDO -->
        <p class="texto-izquierda"
           id="texto-izquierda">
          El ejercicio debia contener un
          sistema de particulas, ....
        </p>

        <!-- TEXTO DERECHO -->
        <p class="texto-derecha"
           id="texto-derecha">
          El ejercicio debia contener un
          sistema de particulas, ....
        </p>

        <!-- CÍRCULO CENTRAL -->
        <div class="anillo-gris">
          <div class="orificio"></div>
        </div>

        <!-- ENLACES EDITABLES -->
        <div class="enlaces">

          <a id="link-jp5"
             href="#"
             target="_blank"
             rel="noopener noreferrer">
            LINK JP5
          </a>

          <a id="link-wiki"
             href="#"
             target="_blank"
             rel="noopener noreferrer">
            LINK WIKI
          </a>

        </div>

      </div>

    </div>

  </section>

</div>

<!-- CONEXIÓN CON JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>
