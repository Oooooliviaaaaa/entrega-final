<!-- ==========================================
     LAS TRES DIAPOSITIVAS
     ========================================== -->

<div id="escenario">

  <!-- =====================================
       DIAPOSITIVA 1: PORTAFOLIO DIGITAL
       ===================================== -->

  <section class="diapositiva activa" id="inicio">

    <!-- TÍTULO EDITABLE -->
    <h1 class="titulo-principal">
      Portafolio Digital
    </h1>

    <!-- NAVEGACIÓN -->
    <nav class="barra">

      <span class="celda"></span>

      <a class="celda" href="#wiki">
        Wiki Casiopea
      </a>

      <!-- ABRE LA DIAPOSITIVA 2 -->
      <a class="celda"
         href="#imagen-escrita"
         id="abrir-imagen">
        Imagen escrita
      </a>

      <a class="celda" href="#sobre-mi">
        Sobre Mi
      </a>

      <span class="celda"></span>

    </nav>

    <!-- TEXTO EDITABLE -->
    <h2 class="titulo-seccion">
      Imagen Escrita
    </h2>

    <p class="descripcion-inicio">
      El curso mezlca
    </p>

  </section>


  <!-- =====================================
       DIAPOSITIVA 2: RUEDA INTERACTIVA
       ===================================== -->

  <section class="diapositiva" id="imagen-escrita">

    <!-- VOLVER AL INICIO -->
    <button class="volver"
            type="button"
            aria-label="Volver al inicio">

      <svg viewBox="0 0 80 80">
        <path d="M39 0 L0 39 L39 78
                 L39 57 L77 57 L77 20
                 L39 20 Z"/>
      </svg>

    </button>

    <!-- RUEDA CON SEIS MINIATURAS -->
    <div class="rueda">

      <svg class="rueda-svg"
           viewBox="0 0 520 520">

        <!-- IMÁGENES DE LOS SEIS SECTORES -->
        <defs id="clips-rueda"></defs>

        <!-- SECTORES INTERACTIVOS -->
        <g id="sectores-rueda"></g>

        <!-- BORDE EXTERIOR NEGRO -->
        <circle
          cx="260"
          cy="260"
          r="247"
          fill="none"
          stroke="black"
          stroke-width="19"
          pointer-events="none"/>

      </svg>

      <!-- PERILLA GIRATORIA -->
      <div class="perilla" id="perilla"
           title="Arrastra para seleccionar un encargo">

        <div class="perilla-interior"></div>
        <div class="aguja" id="aguja"></div>

      </div>

    </div>

    <!-- =====================================
         FOTOGRAFÍA DERECHA

         Siempre coincide con el sector
         señalado por la perilla.
         ===================================== -->

    <div class="marco-derecho">

      <div id="imagen-grande"
           class="panel-verde"></div>

    </div>

  </section>


  <!-- =====================================
       DIAPOSITIVA 3: DETALLE DEL ENCARGO
       ===================================== -->

  <section class="diapositiva" id="detalle">

    <!-- VOLVER AL INICIO -->
    <button class="volver"
            type="button"
            aria-label="Volver al inicio">

      <svg viewBox="0 0 80 80">
        <path d="M39 0 L0 39 L39 78
                 L39 57 L77 57 L77 20
                 L39 20 Z"/>
      </svg>

    </button>

    <!-- FOTOGRAFÍA DEL ENCARGO SELECCIONADO -->
    <div class="marco-izquierdo">

      <div id="imagen-detalle"
           class="panel-verde"></div>

    </div>

    <!-- CÍRCULO CON LOS TEXTOS -->
    <div class="marco-texto">

      <div class="circulo-gris">

        <!-- TÍTULO DEL ENCARGO -->
        <h2 id="titulo-encargo">
          Encargo 1
        </h2>

        <!-- TEXTO IZQUIERDO -->
        <p class="texto-izquierda"
           id="texto-izquierda"></p>

        <!-- TEXTO DERECHO -->
        <p class="texto-derecha"
           id="texto-derecha"></p>

        <!-- CÍRCULO INTERIOR -->
        <div class="anillo-gris">
          <div class="orificio"></div>
        </div>

        <!-- ENLACES -->
        <div class="enlaces">

          <a id="link-jp5"
             href="#"
             target="_blank"
             rel="noopener noreferrer">
            LINK JP5
          </a>

          <a id="link-wiki"
             href="#"
             target="_blank"
             rel="noopener noreferrer">
            LINK WIKI
          </a>

        </div>

      </div>

    </div>

  </section>

</div>
